{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block titulo %}{% endblock %}</title>
</head>
<body>
     <header>
        <h1>
            <a href="{% url 'index' %}" id="titulo-site">Frieren</a>
        </h1>
        <nav>
            <a class="item-menu" href="{% url 'integrantes' %}">Quem somos</a>
            <a class="item-menu" href="{% url 'produtos' %}">Produtos</a>
            <a class="item-menu" href="{% url 'contato' %}">Contato</a>
            {% if user.is_authenticated %}
            <a class="item-menu botao-menu" href="{% url 'dashboard' %}">Dashboard</a>
            <form method="post" action="{% url 'logout' %}" class="form-sair">
                {% csrf_token %}
                <button type="submit" class="botao-sair">Sair</button>
            </form>
            {% else %}
            <a class="item-menu botao-menu" href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://cdn.userway.org/widget.js" data-account="1PNOl5vsyO"></script>
</body>
</html>
